services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auto_and_all
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - auto_and_all_postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auto_and_all"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: development
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --webpack"
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/auto_and_all
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-password}
      WATCHPACK_POLLING: "true"
      # Outgoing email for the estimate form; set these in .env (see .env.example).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ESTIMATE_TO_EMAIL: ${ESTIMATE_TO_EMAIL:-}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - auto_and_all_node_modules:/app/node_modules

volumes:
  auto_and_all_node_modules:
  auto_and_all_postgres_data:
